<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./component/about.css">
    <link rel="stylesheet" href="./component/base.css">
    <link rel="stylesheet" href="./component/footer.css">
    <link rel="stylesheet" href="./component/header.css">
    <link rel="stylesheet" href="./component/hero.css">
    <link rel="stylesheet" href="./component/lightbox.css">
    <link rel="stylesheet" href="./component/portfolio.css">
    <link rel="stylesheet" href="./component/tools.css">
    <link rel="stylesheet" href="./component/contact.css">
    <link rel="stylesheet" href="./component/pageprojet.css">
    <meta name="robots" content="noindex, nofollow">
</head>

<body>

    <header>
        <div class="background01">

            <div class="nom01">
                <p class="titre01">C. jonathan</p>
            </div>

            <div class="divnav01">
                <nav class="nav02">
                    <ul>
                        <!-- Modifié ici pour pointer vers index.html avec l'ancre -->
                        <li><a href="index.html#projets">PROJETS</a></li>
                        <li><a href="index.html#propos">À PROPOS</a></li>
                        <li><a href="index.html#outils">OUTILS</a></li>
                        <li><a href="index.html#contact">CONTACT</a></li>
                    </ul>
                </nav>
            </div>

            <button class="nav-toggle" aria-label="Ouvrir le menu">
                <span class="nav-toggle__bar"></span>
                <span class="nav-toggle__bar"></span>
                <span class="nav-toggle__bar"></span>
            </button>

        </div>
    </header>

    <main class="main">
        <section class="project-detail">
            <!-- En-tête -->
            <div class="project-detail__header">
                <a href="index.html" class="project-detail__back">← Retour aux projets</a>
                <span class="project-detail__number"></span>
                <h1 class="project-detail__title"></h1>

                <div class="project-detail__meta">
                    <div class="project-detail__meta-left">
                        <!-- Catégories -->
                        <div class="project-detail__categories" id="project-categories"></div>

                        <!-- Logiciels utilisés -->
                        <div class="project-detail__software" id="project-software" style="display: none;">
                            <span class="project-detail__software-label">Logiciel(s) utilisé(s) :</span>
                            <span class="project-detail__software-value"></span>
                        </div>
                    </div>

                    <!-- Bouton d'accès rapide aux images -->
                    <a href="#project-gallery-section" class="project-detail__gallery-link" id="gallery-scroll-btn">
                        Voir les images ↓
                    </a>
                </div>
            </div>

            <!-- Description longue -->
            <div class="project-detail__section">
                <h2>Description du projet</h2>
                <p class="project-detail__description"></p>
            </div>

            <!-- Processus créatif (s'affiche si présent dans le JSON) -->
            <div class="project-detail__section" id="project-process-section" style="display: none;">
                <h2>Processus créatif</h2>
                <p class="project-detail__process"></p>
            </div>

            <!-- Galerie d'images en colonnes (2 par rangée) -->
            <div class="project-detail__section" id="project-gallery-section">
                <h2>Galerie du projet</h2>
                <div class="project-detail__gallery" id="project-gallery"></div>
            </div>
        </section>
    </main>

    <!-- Lightbox pour la page de détail -->
    <div class="projectlightbox" id="project-lightbox">
        <div class="projectlightbox__backdrop" data-close="true"></div>
        <div class="projectlightbox__panel" role="dialog" aria-modal="true" aria-label="Aperçu de l'image du projet">
            <button type="button" class="projectlightbox__close" aria-label="Fermer l'image">×</button>
            <img class="projectlightbox__image" src="" alt="">
        </div>
    </div>

    <!-- Lightbox pour la page de détail (Images) -->
    <div class="projectlightbox" id="project-lightbox">
        <div class="projectlightbox__backdrop" data-close="true"></div>
        <div class="projectlightbox__panel" role="dialog" aria-modal="true" aria-label="Aperçu de l'image du projet">
            <button type="button" class="projectlightbox__close" aria-label="Fermer l'image">×</button>
            <img class="projectlightbox__image" src="" alt="">
        </div>
    </div>

    <!-- Lightbox pour la vidéo (À RAJOUTER ICI) -->
    <div class="projectlightbox" id="project-video-lightbox">
        <div class="projectlightbox__backdrop" data-close-video="true"></div>
        <div class="projectlightbox__panel" role="dialog" aria-modal="true" aria-label="Lecture de la vidéo du projet">
            <button type="button" class="projectlightbox__close projectlightbox__close-video"
                aria-label="Fermer la vidéo">×</button>
            <div class="projectlightbox__video-container">
                <video class="projectlightbox__video-element" controls></video>
            </div>
        </div>
    </div>

    <script type="module" src="./js/detail.js"></script>
    <script src="./js/video.js"></script>
    <script type="module" src="./js/lightbox.js"></script>
    <script src="./js/header.js"></script>

</body>

</html>
